name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Lint (selene)
        run: selene src

      - name: Type check (luau-lsp)
        run: |
          rojo sourcemap default.project.json --output sourcemap.json
          # Roblox API types matching the pinned luau-lsp version.
          curl -sSfL -o globalTypes.d.luau \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.1/scripts/globalTypes.d.luau
          luau-lsp analyze --sourcemap=sourcemap.json --definitions=@roblox=globalTypes.d.luau src

      - name: Format (StyLua)
        run: stylua --check src

      - name: Build
        run: rojo build default.project.json --output RoVision.rbxm
